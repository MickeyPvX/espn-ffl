[package]
name = "espn-ffl"
version = "2.3.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0.0"
lru = "0.18"
rayon = "1.12"
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"

[features]
test-utils = []

# Coverage reporting
[package.metadata.coverage.report]

# Configure tarpaulin coverage
exclude_files = [
    "src/main.rs",      # CLI entry point - tested via integration
    "*/tests.rs",       # Test files themselves
    "*/tests/*",        # Test modules
]
